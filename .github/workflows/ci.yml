name: ci

on:
  push:
    branches: [main]
  pull_request:

# Detailed test pipeline. A successful run on main ends in a release (tag + GitHub
# release) when plugin.json carries a new version; the release job is gated on all
# test jobs passing.
jobs:
  static:
    name: static checks (shellcheck / frontmatter / markdownlint / manifests / abspath)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run static checks
        run: |
          rc=0
          for s in tests/static/*.sh; do echo "== $s =="; bash "$s" || rc=1; done
          exit $rc

  unit:
    name: unit tests (lib functions, no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all unit suites
        run: |
          rc=0
          for t in tests/unit/*.sh; do echo "== $t =="; bash "$t" || rc=1; done
          exit $rc

  integration:
    name: integration tests (mock SSH server + rsync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure rsync present
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Run integration suite (boots a Docker mock server)
        run: bash tests/integration/run-all.sh

  release:
    name: release on version bump
    needs: [static, unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read plugin version
        id: v
        run: echo "version=$(python3 -c "import json;print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Tag + release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to release."; exit 0
          fi
          git config user.name "CallMeTechie"
          git config user.email "ma.backes@outlook.com"
          git tag -a "$TAG" -m "fleet-manager $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "fleet-manager $TAG" --generate-notes
